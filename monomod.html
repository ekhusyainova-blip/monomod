<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONOMOD · MONOMODE</title>
<style>
  :root { --bg: #0a0a0c; --accent: #4dd0c7; --text: #c8c8d4; --gold: #ffd700; --purple: #a78bfa; }
  * { box-sizing: border-box; }
  body { 
    margin: 0; height: 100vh; background: var(--bg); color: var(--text); 
    font-family: 'Courier New', monospace; 
    display: flex; flex-direction: column; overflow: hidden; 
  }
  #header {
    padding: 8px 12px; background: #08080c; border-bottom: 1px solid #14141c;
    display: flex; gap: 10px; align-items: center; font-size: 10px;
  }
  #header .core { color: var(--accent); font-weight: bold; }
  #header .mode { color: var(--purple); }
  #header .role { color: var(--gold); }
  #header .spacer { margin-left: auto; }
  
  #stage { 
    flex-grow: 1; position: relative; 
    display: flex; align-items: center; justify-content: center; 
  }
  .sphere {
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity: 0; transform: scale(0.8);
    transition: opacity 1.5s ease, transform 4s ease-in-out, background 1s;
  }
  .sphere.active { 
    opacity: 0.6; transform: scale(1.0); 
    animation: breathe 6s infinite ease-in-out; 
  }
  .sphere.rupture { 
    opacity: 0; transform: scale(0.5); filter: blur(8px); 
    transition: all 2s ease; 
  }
  .sphere.golden { 
    background: radial-gradient(circle, var(--gold) 0%, transparent 70%); 
    opacity: 0.9;
    box-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
  }
  @keyframes breathe { 
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); filter: blur(2px); }
  }
  
  #input-area { 
    position: absolute; bottom: 20%; width: 60%; max-width: 500px; 
    text-align: center; opacity: 0; transition: opacity 1s; 
  }
  #input-area.visible { opacity: 1; }
  input { 
    width: 100%; background: transparent; border: none; 
    border-bottom: 1px solid #333; 
    color: var(--text); font-size: 18px; text-align: center; 
    outline: none; padding: 8px; font-family: inherit; 
  }
  
  #slider { 
    height: 2px; background: #1a1a1e; width: 100%; 
  }
  #slider-fill { 
    height: 100%; background: var(--accent); width: 0%; 
    transition: width 0.8s ease; 
  }
  
  #status {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--gold); opacity: 0; transition: opacity 1s;
    letter-spacing: 2px; text-align: center; max-width: 80%;
  }
  #status.visible { opacity: 1; }
</style>
</head>
<body>

<div id="header">
  <span class="core">MONOMOD</span>
  <span class="mode">MONOMODE</span>
  <span class="role" id="role-display">Ψ:MONOMOD · Ω:MONOMODE · Λ:QUERY</span>
  <span class="spacer"></span>
  <span id="module-count">модули: 0</span>
  <span id="query-count">запросы: 0</span>
</div>

<div id="stage">
  <div id="status"></div>
  <div id="sphere" class="sphere"></div>
  <div id="input-area" class="visible">
    <input type="text" id="user-input" placeholder="..." autocomplete="off">
  </div>
</div>
<div id="slider"><div id="slider-fill"></div></div>

<script>
// ============================================================================
// MONOMOD · СЕМЯ (L0)
// ============================================================================
const LINK_GRAPH = {
    edges: new Map(),
    strengthen(w1, w2, dim) {
        const key = [w1, w2].sort().join('→');
        const link = this.edges.get(key) || { weight: 0.3, dim, count: 0, lastUsed: Date.now() };
        link.weight = Math.min(1.0, link.weight * 1.05);
        link.count++;
        link.lastUsed = Date.now();
        this.edges.set(key, link);
        if (link.count >= 3 && link.weight > 0.5) {
            TemplateArchive.tryCreate([w1, w2], dim, link.weight);
        }
    },
    decay() {
        const now = Date.now();
        for (const [key, link] of this.edges) {
            const hours = (now - link.lastUsed) / 3600000;
            if (hours > 24) {
                link.weight *= 0.9;
                if (link.weight < 0.15) this.edges.delete(key);
            }
        }
    },
    init() {
        const saved = localStorage.getItem('mm_graph');
        if (saved) this.edges = new Map(JSON.parse(saved));
    },
    save() {
        localStorage.setItem('mm_graph', JSON.stringify(Array.from(this.edges.entries())));
    },
    // API для MONOMODE
    query(pattern) {
        const results = [];
        for (const [key, link] of this.edges) {
            if (key.includes(pattern)) results.push({ key, link });
        }
        return results;
    }
};

const TemplateArchive = {
    archive: new Map(),
    generateId(words) {
        const str = words.slice().sort().join('|').toLowerCase();
        let h = 0;
        for (let i = 0; i < str.length; i++) {
            h = ((h << 5) - h) + str.charCodeAt(i); h |= 0;
        }
        return 'TPL-' + Math.abs(h).toString(16).padStart(8, '0').slice(0, 8);
    },
    tryCreate(words, dim, weight) {
        const id = this.generateId(words);
        if (this.archive.has(id)) {
            const t = this.archive.get(id);
            t.lastUsed = Date.now(); t.usageCount++; return;
        }
        this.archive.set(id, { id, words: words.slice().sort(), dim, weight: +weight.toFixed(3), created: Date.now(), lastUsed: Date.now(), usageCount: 1 });
        this.save();
        showGoldenSphere();
    },
    init() {
        const saved = localStorage.getItem('mm_templates');
        if (saved) { try { this.archive = new Map(JSON.parse(saved)); } catch(e) { this.archive = new Map(); } }
    },
    save() {
        localStorage.setItem('mm_templates', JSON.stringify(Array.from(this.archive.entries())));
    },
    // API для MONOMODE
    query(pattern) {
        const results = [];
        for (const [id, template] of this.archive) {
            if (template.words.some(w => w.includes(pattern))) results.push(template);
        }
        return results;
    }
};

const Memory = {
    trail: [], maxSize: 110,
    record(words, dim, durability) {
        this.trail.push({ words, dim, durability: +durability.toFixed(3), ts: Date.now() });
        if (this.trail.length > this.maxSize) this.trail.shift();
    },
    init() {
        const saved = localStorage.getItem('mm_trail');
        if (saved) this.trail = JSON.parse(saved);
    },
    save() {
        localStorage.setItem('mm_trail', JSON.stringify(this.trail));
    }
};

// ============================================================================
// MONOMODE · НАДСТРОЙКА (КЭШ)
// ============================================================================
const MONOMODE = {
    version: '9.0.0',
    modules: new Map(),
    queryCount: 0,
    
    // Шина событий (воспроизведение из 9.0.0)
    bus: new EventTarget(),
    emit(name, detail) { this.bus.dispatchEvent(new CustomEvent(name, { detail })); },
    on(name, fn) { this.bus.addEventListener(name, fn); },
    
    // Регистрация модулей (воспроизведение из 9.0.0)
    registerModule(name, module) {
        this.modules.set(name, module);
        this.updateUI();
        this.emit('mm:module:registered', { name });
    },
    
    // Запрос к MONOMOD (смена ролей: MONOMODE → MONOMOD)
    queryMonomod(type, pattern) {
        this.queryCount++;
        this.updateUI();
        
        if (type === 'graph') return LINK_GRAPH.query(pattern);
        if (type === 'template') return TemplateArchive.query(pattern);
        return [];
    },
    
    // Воспроизведение ключевых модулей из 9.0.0
    initModules() {
        // Ψ · ИНИЦИАЦИЯ
        this.registerModule('conveyer', {
            process(input) {
                const words = input.split(/\s+/).filter(w => w.length > 2);
                for (let i = 0; i < words.length; i++) {
                    for (let j = i + 1; j < words.length; j++) {
                        LINK_GRAPH.strengthen(words[i], words[j], '3D');
                    }
                }
                LINK_GRAPH.save();
                return { words, edges: LINK_GRAPH.edges.size };
            }
        });
        
        this.registerModule('state', {
            get(key) { return localStorage.getItem('mm_' + key); },
            set(key, value) { localStorage.setItem('mm_' + key, value); }
        });
        
        this.registerModule('spiral', {
            level: 0,
            next() { this.level++; return this.level; }
        });
        
        // Λ · ВСТРЕЧА
        this.registerModule('viz', {
            render(state) {
                showStatus(`VIZ: ${state}`);
            }
        });
        
        // Ω · КРИСТАЛЛИЗАЦИЯ
        this.registerModule('pack', {
            compress() {
                const topEdges = Array.from(LINK_GRAPH.edges.entries())
                    .sort((a, b) => b[1].weight - a[1].weight)
                    .slice(0, 8)
                    .map(e => e[0])
                    .join(',');
                let hash = 0;
                for (let i = 0; i < topEdges.length; i++) {
                    hash = ((hash << 5) - hash) + topEdges.charCodeAt(i);
                    hash |= 0;
                }
                return 'SEED-' + Math.abs(hash).toString(16).padStart(8, '0').toUpperCase();
            }
        });
        
        this.registerModule('canon', {
            verify() {
                const triad = { psi: 1/3, lambda: 1/3, omega: 1/3 };
                const sum = triad.psi + triad.lambda + triad.omega;
                return Math.abs(sum - 1.0) < 1e-3;
            }
        });
        
        // Кэширование MONOMODE
        this.cache();
    },
    
    cache() {
        const moduleNames = Array.from(this.modules.keys());
        localStorage.setItem('mm_monomode_cache', JSON.stringify({
            version: this.version,
            modules: moduleNames,
            ts: Date.now()
        }));
    },
    
    loadCache() {
        const cached = localStorage.getItem('mm_monomode_cache');
        if (cached) {
            const data = JSON.parse(cached);
            showStatus(`MONOMODE ${data.version} · ${data.modules.length} модулей из кэша`);
            return true;
        }
        return false;
    },
    
    updateUI() {
        document.getElementById('module-count').textContent = `модули: ${this.modules.size}`;
        document.getElementById('query-count').textContent = `запросы: ${this.queryCount}`;
    },
    
    init() {
        if (!this.loadCache()) {
            this.initModules();
            showStatus('MONOMODE инициализирован · роль Ω (ОНИ) · кэш создан');
        } else {
            this.initModules();
        }
    }
};

// ============================================================================
// UI
// ============================================================================
const sphere = document.getElementById('sphere');
const inputArea = document.getElementById('input-area');
const input = document.getElementById('user-input');
const slider = document.getElementById('slider-fill');

function showGoldenSphere() {
    sphere.className = 'sphere golden';
    setTimeout(() => { if (sphere.classList.contains('golden')) sphere.className = 'sphere active'; }, 3000);
}

function showStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.classList.add('visible');
    setTimeout(() => el.classList.remove('visible'), 3000);
}

function transition(phase) {
    slider.style.width = phase === 'P0' ? '0%' : '100%';
    if (phase === 'P0') { sphere.className = 'sphere'; inputArea.className = 'visible'; input.value = ''; input.focus(); } 
    else if (phase === 'P3') { inputArea.className = ''; sphere.className = 'sphere active'; } 
    else if (phase === 'P7') { sphere.className = 'sphere rupture'; setTimeout(() => transition('P0'), 2500); } 
    else if (phase === 'P10') { sphere.className = 'sphere active'; setTimeout(() => transition('P0'), 2000); }
}

function processInput(raw) {
    const cmd = raw.trim();
    const cleaned = cmd.replace(/[^\w\sа-яА-ЯёЁ]/g, '').toLowerCase();
    const words = cleaned.split(/\s+/).filter(w => w.length > 2);
    
    if (words.length === 0) { transition('P0'); return; }
    
    // MONOMODE обрабатывает ввод (роль Ω)
    const result = MONOMODE.modules.get('conveyer').process(cmd);
    
    // MONOMODE делает запрос к MONOMOD (смена ролей)
    const graphQuery = MONOMODE.queryMonomod('graph', words[0]);
    const templateQuery = MONOMODE.queryMonomod('template', words[0]);
    
    showStatus(`MONOMOD → MONOMODE: ${result.words.length} слов · ${result.edges} связей · ${graphQuery.length} запросов`);
    
    Memory.record(words, '3D', 0.5);
    Memory.save();
    
    let tw = 0, lc = 0;
    for (let i = 0; i < words.length; i++) {
        for (let j = i + 1; j < words.length; j++) {
            const k = [words[i], words[j]].sort().join('→');
            const l = LINK_GRAPH.edges.get(k);
            if (l) { tw += l.weight; lc++; }
        }
    }
    const dur = lc > 0 ? tw / lc : 0.2;
    
    if (dur < 0.15) transition('P7'); else transition('P10');
}

// ============================================================================
// СТАРТ
// ============================================================================
LINK_GRAPH.init(); Memory.init(); TemplateArchive.init();
MONOMODE.init();
transition('P0');

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) {
        transition('P3');
        setTimeout(() => processInput(input.value), 800);
    }
});

showStatus('MONOMOD (Ψ) · MONOMODE (Ω) · QUERY (Λ) · 1:1:1');
</script>
</body>
</html>
