<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONOMOD · HOME3</title>
<style>
  :root { --bg: #0a0a0c; --accent: #4dd0c7; --text: #c8c8d4; }
  body { margin: 0; height: 100vh; background: var(--bg); color: var(--text); 
         font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
  #stage { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; }
  .sphere {
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity: 0; transform: scale(0.8);
    transition: opacity 1.5s ease, transform 4s ease-in-out;
  }
  .sphere.active { opacity: 0.6; transform: scale(1.0); animation: breathe 6s infinite ease-in-out; }
  .sphere.rupture { opacity: 0; transform: scale(0.5) blur(8px); transition: all 2s ease; }
  @keyframes breathe {
    0%, 100% { transform: scale(1.0); filter: blur(0px); }
    50% { transform: scale(1.05); filter: blur(2px); }
  }
  #input-area { position: absolute; bottom: 20%; width: 60%; max-width: 500px; text-align: center; opacity: 0; transition: opacity 1s; }
  #input-area.visible { opacity: 1; }
  input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #333; 
          color: var(--text); font-size: 18px; text-align: center; outline: none; padding: 8px; }
  #slider { height: 2px; background: #1a1a1e; width: 100%; position: relative; }
  #slider-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.8s ease; }
</style>
</head>
<body>
  <div id="stage">
    <div id="sphere" class="sphere"></div>
    <div id="input-area" class="visible">
      <input type="text" id="user-input" placeholder="..." autocomplete="off">
    </div>
  </div>
  <div id="slider"><div id="slider-fill"></div></div>
<script>
  const state = { phase: 'P0', durability: 1.0 };
  const sphere = document.getElementById('sphere');
  const inputArea = document.getElementById('input-area');
  const input = document.getElementById('user-input');
  const slider = document.getElementById('slider-fill');

  function transition(phase) {
    state.phase = phase;
    slider.style.width = phase === 'P0' ? '0%' : (phase === 'P7' ? '70%' : '100%');
    
    if (phase === 'P0') {
      sphere.className = 'sphere';
      inputArea.className = 'visible';
      input.value = '';
      input.focus();
    } else if (phase === 'P3') {
      inputArea.className = '';
      sphere.className = 'sphere active';
    } else if (phase === 'P7') {
      sphere.className = 'sphere rupture';
      setTimeout(() => transition('P10'), 2000);
    } else if (phase === 'P10') {
      sphere.className = 'sphere';
      setTimeout(() => transition('P0'), 1000);
    }
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) {
      transition('P3');
      setTimeout(() => {
        state.durability = Math.random();
        if (state.durability < 0.15) {
          transition('P7');
        } else {
          transition('P10');
        }
      }, 3000);
    }
  });

  transition('P0');
</script>
</body>
</html>
