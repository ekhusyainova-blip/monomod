<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONOMOD</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>

<div id="stage">
  <div id="output"></div>
  <div id="sphere" class="sphere"></div>
  <div id="input-area" class="visible">
    <input type="text" id="user-input" placeholder="..." autocomplete="off">
  </div>
</div>
<div id="slider"><div id="slider-fill"></div></div>

<div id="stage">
  <canvas id="klepa"></canvas>
  <div id="output"></div>
  <div id="sphere" class="sphere"></div>
  <div id="input-area" class="visible">
    <input type="text" id="user-input" placeholder="..." autocomplete="off">
  </div>
  <div id="strategy-switch">
    <button data-strategy="auto" class="on">AUTO</button>
    <button data-strategy="graph">GRAPH</button>
    <button data-strategy="memory">MEM</button>
    <button data-strategy="echo">ECHO</button>
  </div>
</div>
<div id="slider"><div id="slider-fill"></div></div>
