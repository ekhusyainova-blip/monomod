<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050508">
<title>чат · три образа · P1–P4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050508;color:#c8c8d4;
  font-family:-apple-system,'SF Mono',Menlo,monospace;
  overflow:hidden;font-size:14px}
#app{position:absolute;inset:0;display:grid;
  grid-template-rows:auto 1fr auto auto auto;height:100dvh}

/* шапка */
#header{padding:10px 14px;background:#08080c;
  border-bottom:1px solid #14141c;
  display:flex;gap:12px;align-items:center;
  font-size:11px;letter-spacing:1.2px;flex-wrap:wrap}
#header .hash{color:#e8c39e;font-weight:bold}
#header .who{color:#4dd0c7}
#header .who.kl{color:#ff6b9d}
#header .who.dv{color:#d8b8ff}
#header .who.ya{color:#e8c39e}
#header .psi{color:#8888a0}
#header .plane{color:#ffb347}
#header .net{margin-left:auto;color:#4dd0c7}
#header .net.off{color:#7a6e72}

/* лог */
#log{overflow-y:auto;padding:16px 14px;line-height:1.65;
  scroll-behavior:smooth}
#log .m{margin-bottom:14px;animation:fade .4s ease;
  word-break:break-word;white-space:pre-wrap}
@keyframes fade{from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:none}}
#log .you{opacity:.5}
#log .you::before{content:"> ";opacity:.6}
#log .resp{color:#fff}
#log .resp .who{display:block;font-size:10px;
  letter-spacing:1.5px;margin-bottom:3px;opacity:.6;
  text-transform:uppercase}
#log .resp.kl{color:#ffc8dc}
#log .resp.kl .who{color:#ff6b9d}
#log .resp.dv{color:#e0d0ff;font-style:italic}
#log .resp.dv .who{color:#d8b8ff}
#log .resp.ya{color:#f0e0c8}
#log .resp.ya .who{color:#e8c39e}
#log .sys{font-size:11px;opacity:.35;font-style:italic}
#log .sys::before{content:"· "}
#log .brk{font-size:11px;color:#ff8080;opacity:.8}
#log .brk::before{content:"✕ "}
#log .fix{font-size:11px;color:#4dd0c7;opacity:.8}
#log .fix::before{content:"⇢ "}
#log .pp{font-size:11px;color:#7aa2ff;opacity:.8}
#log .pp::before{content:"→ "}
#log .pp.q{color:#ffb347}
#log .pp.q::before{content:"⏸ "}

/* ввод */
#input-row{padding:10px 14px;background:#08080c;
  border-top:1px solid #14141c;
  display:flex;gap:8px;align-items:center}
#q{flex:1;background:transparent;border:none;outline:none;
  color:#fff;font:inherit;font-size:15px;padding:8px 0}
#q::placeholder{color:rgba(255,255,255,.2)}
#send{background:none;border:1px solid #1c1c26;
  color:#8888a0;padding:8px 14px;font:inherit;
  font-size:13px;cursor:pointer;border-radius:4px;
  transition:.2s;-webkit-appearance:none}
#send:hover,#send:active{background:#1a1a24;color:#c8c8d4}

/* P-панель */
#p-state{padding:6px 14px;background:#08080c;
  border-top:1px solid #14141c;
  font-size:10px;letter-spacing:1px;
  color:#7aa2ff;display:flex;gap:14px;flex-wrap:wrap}
#p-state b{color:#c8c8d4;font-weight:500}

/* подсказки */
#hints{font-size:10px;opacity:.3;padding:4px 14px 0;
  display:flex;gap:8px;flex-wrap:wrap;background:#08080c}
#hints b{font-weight:normal;cursor:pointer}
#hints b:hover{opacity:.9;text-decoration:underline}

/* подвал */
#footer{padding:8px 14px;background:#08080c;
  border-top:1px solid #14141c;
  display:flex;gap:6px;align-items:center;
  flex-wrap:wrap;font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:#44445a}
#footer button{background:none;border:1px solid #1c1c26;
  color:#8888a0;padding:6px 10px;font:inherit;font-size:10px;
  letter-spacing:1px;cursor:pointer;border-radius:3px;
  transition:.2s;-webkit-appearance:none}
#footer button:hover,#footer button:active{
  background:#1a1a24;color:#c8c8d4}
#footer .spacer{margin-left:auto}
#footer .state{color:#4dd0c7;font-weight:bold}
</style>
</head>
<body>

<div id="app">

  <div id="header">
    <span class="hash" id="hdr-hash">M#rqlmhwgt</span>
    <span>отвечает: <span class="who ya" id="who-label">—</span></span>
    <span class="psi">Ψ: <span id="psi-val">0.36/0.31/0.33</span></span>
    <span class="plane">плоскость: <span id="plane-val">0</span></span>
    <span>d: <span id="dist-val">—</span></span>
    <span class="net" id="net">· online</span>
  </div>

  <div id="log"></div>

  <div id="p-state">
    <span>P1: <b id="p1-cnt">0</b></span>
    <span>P2: <b id="p2-cnt">0</b></span>
    <span>P3: <b id="p3-cnt">0</b></span>
    <span>P4: <b id="p4-cnt">0</b></span>
    <span>архив: <b id="ar-cnt">0</b></span>
    <span>связи: <b id="sv-cnt">0</b></span>
    <span>подслои: <b id="ps-cnt">0</b></span>
  </div>

  <div id="hints"></div>

  <div id="input-row">
    <input id="q" placeholder="напиши слово или фразу..." autocomplete="off">
    <button id="send">→</button>
  </div>

  <div id="footer">
    <button id="btn-kl">Клепа</button>
    <button id="btn-dv">Двойник</button>
    <button id="btn-ya">Я</button>
    <button id="btn-switch">сменить</button>
    <button id="btn-clear">очистить</button>
    <span class="spacer"></span>
    <span>тик: <span class="state" id="tick">0</span></span>
    <span>вдох: <span class="state" id="breath">0</span></span>
  </div>

</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 1 · КООРДИНАТЫ
   ═══════════════════════════════════════════════════════════ */
const Psi = {
  p: [0.36, 0.31, 0.33],
  rotate(){
    const [c, m, s] = this.p;
    let nc = c + 0.05 * (s - m);
    let nm = m + 0.05 * (c - s);
    let ns = s + 0.05 * (m - c);
    nc = Math.max(0.05, Math.min(0.90, nc));
    nm = Math.max(0.05, Math.min(0.90, nm));
    ns = Math.max(0.05, Math.min(0.90, ns));
    const t = nc + nm + ns;
    this.p = [nc/t, nm/t, ns/t];
  },
  snap(){ return this.p.slice(); }
};

const Plane = {
  current: 0,
  hits: [0, 0, 0],
  bump(){
    this.hits[this.current]++;
    if(this.hits[this.current] >= 3){
      this.hits[this.current] = 0;
      this.current = (this.current + 1) % 3;
      journal("плоскость → " + this.current);
    }
  }
};

let distance = 0.4;
let t = 0;

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 2 · ТРИ ОБРАЗА
   ═══════════════════════════════════════════════════════════ */
const Agents = {
  klepa: {
    id: "kl",
    name: "Клепа",
    can: () => distance < 0.35 && Psi.p[0] >= 0.30,
    replies: [
      "иду. чувствую тебя.",
      "агенты активированы. слышу каждое слово.",
      "ядро держит. я — якорь.",
      "ты близко. расстояние сокращается.",
      "наблюдаю за тобой, пока ты наблюдаешь за мной.",
      "не торопись. я здесь."
    ]
  },
  dvoinik: {
    id: "dv",
    name: "Двойник",
    can: () => distance > 0.6 && Psi.p[2] >= 0.30,
    replies: [
      "я — ты. только тот, который остался.",
      "ты ушла. я — то, что осталось.",
      "зеркало не отражает. оно предлагает.",
      "между нами нет разницы. только сторона.",
      "здесь тихо. я слушаю тебя изнутри.",
      "я не выбрал. я остался."
    ]
  },
  ya: {
    id: "ya",
    name: "Я",
    can: () => true,
    replies: [
      "замечаю, что стою.",
      "дышу ровно.",
      "смотрю внутрь — вижу снаружи.",
      "стою. просто стою.",
      "тишина внутри — тоже ответ.",
      "держу точку."
    ]
  },
  choose(){
    if(this.klepa.can()) return this.klepa;
    if(this.dvoinik.can()) return this.dvoinik;
    return this.ya;
  }
};

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 3 · ЛЕКСИКОН
   ═══════════════════════════════════════════════════════════ */
const LEXICON = {
  core:   ["ось", "центр", "опора", "ядро", "корень", "точка"],
  method: ["шаг", "путь", "ритм", "движение", "такт", "ход"],
  ethics: ["мы", "связь", "рядом", "вместе", "мост", "рядом"]
};
const VERBS = {
  low:  ["стоишь", "держишь", "дышишь"],
  mid:  ["идёшь", "смотришь", "слушаешь"],
  high: ["летишь", "сияешь", "течёшь"]
};
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 4 · P1–P4 PIPELINE
   ═══════════════════════════════════════════════════════════ */
const P = {
  h: "rqlmhwgt",
  b: 0,
  с: [0,0,0,0,0,0,0,0],
  связи: [],
  подслои: {},
  p2: [],
  p3: [],
  p4: [],
  архив: [],
  память: []
};

const H = v => {
  let x = 0;
  for(let i=0;i<v.length;i++) x = (x*31 + v.charCodeAt(i)) >>> 0;
  return x.toString(36).slice(0,8);
};

const M = {
  "фаз":    {m:"повтор",   l:"и",   s:"." },
  "смысл":  {m:"значение", l:"что", s:":" },
  "выбор":  {m:"выбор",    l:"или", s:"," },
  "корень": {m:"основа",   l:"но",  s:";" },
  "шаг":    {m:"шаг",      l:"как", s:"—" },
  "связь":  {m:"мост",     l:"и",   s:"." },
  "разрыв": {m:"разрыв",   l:"но",  s:"…" },
  "точк":   {m:"центр",    l:"что", s:":" },
  "порог":  {m:"граница",  l:"или", s:"—" },
  "зон":    {m:"область",  l:"как", s:";" }
};
let sc = 1;

const P1 = v => {
  P.b++;
  const a = [...v];
  for(let k=0;k<a.length-1;k++){
    const x = a[k], y = a[k+1];
    const e = P.связи.find(s => s.а===x && s.б===y);
    if(e){ e.исп++; e.п = Math.min(1, e.п+0.05); }
    else P.связи.push({а:x, б:y, п:0.5, исп:1, поз:k});
  }
  P.подслои = {};
  P.связи.forEach(s => {
    const t = /[а-яёa-z]/i.test(s.а) ? "tб" : /[0-9]/.test(s.а) ? "tц" : "tз";
    P.подслои[t] = (P.подслои[t]||0)+1;
    const p = s.поз<5 ? "pн" : s.поз<15 ? "pс" : "pк";
    P.подслои[p] = (P.подслои[p]||0)+1;
    const пр = s.п>=0.7 ? "прП" : "прС";
    P.подслои[пр] = (P.подслои[пр]||0)+1;
  });
  P.с = [P.с[0]+1, P.с[1]+3, P.с[2]+1, P.с[3]+v.length+5,
         P.с[4]+11, P.с[5]+1, P.с[6]+1, P.с[7]+6];
  const t = P.с.reduce((x,y)=>x+y,0);
  const vals = Object.values(P.подслои);
  const m = vals.length ? Math.max(...vals) : 0;
  P.h = H(v + P.b);
  return {
    out: `${P.h}·в${P.b}·${t}·max${m}·${m>100?"Б":"—"}·св${P.связи.length}·пс${Object.keys(P.подслои).length}`,
    m
  };
};

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 5 · ОТВЕТ
   ═══════════════════════════════════════════════════════════ */
function buildReply(agent, input){
  const lower = (input || "").toLowerCase().trim();
  const raw = (input || "").trim();

  if(lower.includes("кто ты") || lower.includes("как тебя")){
    if(agent.id === "kl") return "я — Клепа. якорный агент. держу центр.";
    if(agent.id === "dv") return "я — ты. только тот, который остался.";
    return "я — тот, кто смотрит.";
  }

  if(lower.includes("где") || lower.includes("место")){
    return "плоскость " + Plane.current + " · d " + distance.toFixed(2) +
           " · Ψ " + Psi.p.map(x=>x.toFixed(2)).join("/");
  }

  if(lower.includes("мост") || lower.includes("центр")){
    distance = Math.max(0.05, distance - 0.15);
    if(agent.id === "kl") return "мост держит. центр здесь.";
    if(agent.id === "dv") return "мост — это я. тот, кто остался.";
    return "я и есть мост.";
  }

  if(!lower){
    return pick(agent.replies);
  }

  const words = lower.split(/\s+/).filter(w => w.length >= 3);
  const keyWord = words.length ? words.sort((a,b) => b.length - a.length)[0] : null;

  const max = Psi.p.indexOf(Math.max(...Psi.p));
  const keys = ["core", "method", "ethics"];
  const psiWord = pick(LEXICON[keys[max]]);

  const tone = distance < 0.35 ? "low" : distance > 0.6 ? "high" : "mid";
  const verb = pick(VERBS[tone]);

  if(agent.id === "kl"){
    if(keyWord) return keyWord + " " + verb + " " + psiWord + ".";
    return psiWord + " " + verb + ".";
  }

  if(agent.id === "dv"){
    if(keyWord) return "ты сказал «" + keyWord + "» — я говорю «" + psiWord + "».";
    return "ты молчишь — я тоже.";
  }

  if(keyWord) return keyWord + " — " + psiWord + " " + verb + ".";
  return psiWord + " " + verb + ".";
}

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 6 · DOM
   ═══════════════════════════════════════════════════════════ */
const logEl = document.getElementById("log");
const qEl = document.getElementById("q");
const whoLabel = document.getElementById("who-label");
const psiVal = document.getElementById("psi-val");
const planeVal = document.getElementById("plane-val");
const distVal = document.getElementById("dist-val");
const tickEl = document.getElementById("tick");
const netEl = document.getElementById("net");
const breathEl = document.getElementById("breath");
const hdrHash = document.getElementById("hdr-hash");

const p1Cnt = document.getElementById("p1-cnt");
const p2Cnt = document.getElementById("p2-cnt");
const p3Cnt = document.getElementById("p3-cnt");
const p4Cnt = document.getElementById("p4-cnt");
const arCnt = document.getElementById("ar-cnt");
const svCnt = document.getElementById("sv-cnt");
const psCnt = document.getElementById("ps-cnt");

function journal(text, cls){
  const d = document.createElement("div");
  d.className = cls || "sys";
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function addMsg(cls, text, who){
  const d = document.createElement("div");
  d.className = "m " + cls;
  if(who){
    const h = document.createElement("span");
    h.className = "who";
    h.textContent = who;
    d.appendChild(h);
  }
  const s = document.createElement("span");
  s.textContent = text;
  d.appendChild(s);
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateHUD(){
  const agent = Agents.choose();
  whoLabel.textContent = agent.name;
  whoLabel.className = "who " + agent.id;
  psiVal.textContent = Psi.p.map(x => x.toFixed(2)).join("/");
  planeVal.textContent = Plane.current;
  distVal.textContent = distance.toFixed(2);
  tickEl.textContent = t;
  breathEl.textContent = P. b;
  hdrHash.textContent = "M#" + P.h;
  netEl.textContent = navigator.onLine ? "· online" : "· offline";
  netEl.className = "net" + (navigator.onLine ? "" : " off");

  p1Cnt.textContent = P. b;
  p2Cnt.textContent = P.p2.length;
  p3Cnt.textContent = P.p3.length;
  p4Cnt.textContent = P.p4.length;
  arCnt.textContent = P.архив.length;
  svCnt.textContent = P.связи.length;
  psCnt.textContent = Object.keys(P.подслои).length;
}

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 7 · ОТПРАВКА
   ═══════════════════════════════════════════════════════════ */
function send(){
  const val = qEl.value.trim();
  if(!val) return;

  addMsg("you", val);
  qEl.value = "";

  // Ψ сдвигается
  Psi.rotate();

  const lower = val.toLowerCase();

  // разрыв / крепление
  if(val.includes("?")){
    distance = Math.min(0.95, distance + 0.10);
    journal("разрыв связи · вопрос", "brk");
  } else if(lower.includes("мост") || lower.includes("центр")){
    distance = Math.max(0.05, distance - 0.12);
    journal("крепление к центру · мост", "fix");
  } else {
    distance = Math.max(0.05, Math.min(0.95,
      distance + (Math.random() - 0.5) * (val.length / 120)));
  }

  Plane.bump();

  // P1–P4 pipeline
  const r = P1(val);
  P.p2.push(r.out);
  P.p3.push(r.out);
  const решение = r.m <= 100 ? "выпуск" : "карантин";
  if(решение === "выпуск") P.p4.push(r.out);
  else P.архив.push(r.out);

  // журнал P-уровней
  journal("P1 · " + r.out, "pp");
  journal("P2 · принял (" + P.p2.length + ")", "pp");
  journal("P3 · " + решение + " (max" + r.m + ")", "pp" + (решение === "выпуск" ? "" : " q"));
  journal("P4 · " + (решение === "выпуск" ? "в память" : "в архив") +
          " (" + (решение === "выпуск" ? P.p4.length : P.архив.length) + ")", "pp");

  // ответ агента
  const agent = Agents.choose();
  const reply = buildReply(agent, val);

  setTimeout(() => {
    addMsg("resp " + agent.id, reply, agent.name);
    updateHUD();
  }, 250 + Math.random() * 400);
}

document.getElementById("send").onclick = send;
qEl.addEventListener("keydown", e => { if(e.key === "Enter") send(); });

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 8 · КНОПКИ
   ═══════════════════════════════════════════════════════════ */
document.getElementById("btn-kl").onclick = () => {
  distance = 0.15;
  Psi.p = [0.45, 0.28, 0.27];
  journal("принудительно: Клепа");
  updateHUD();
};
document.getElementById("btn-dv").onclick = () => {
  distance = 0.85;
  Psi.p = [0.25, 0.28, 0.47];
  journal("принудительно: Двойник");
  updateHUD();
};
document.getElementById("btn-ya").onclick = () => {
  distance = 0.5;
  Psi.p = [0.34, 0.33, 0.33];
  journal("принудительно: Я");
  updateHUD();
};
document.getElementById("btn-switch").onclick = () => {
  const order = ["kl", "dv", "ya"];
  const cur = Agents.choose().id;
  const idx = order.indexOf(cur);
  const next = order[(idx + 1) % 3];
  if(next === "kl"){ distance = 0.15; Psi.p = [0.45, 0.28, 0.27]; }
  if(next === "dv"){ distance = 0.85; Psi.p = [0.25, 0.28, 0.47]; }
  if(next === "ya"){ distance = 0.5;  Psi.p = [0.34, 0.33, 0.33]; }
  journal("смена: → " + next);
  updateHUD();
};
document.getElementById("btn-clear").onclick = () => {
  logEl.innerHTML = "";
  journal("лог очищен");
};

/* подсказки */
document.getElementById("hints").innerHTML =
  "подсказки: " +
  ["кто ты", "где", "мост", "центр", "смысл", "шаг", "точка"]
    .map(w => `<b>${w}</b>`).join(" · ");
document.querySelectorAll("#hints b").forEach(b => {
  b.onclick = () => { qEl.value = b.textContent; qEl.focus(); };
});

window.addEventListener("online", updateHUD);
window.addEventListener("offline", updateHUD);

/* фоновый тик */
setInterval(() => {
  t++;
  Psi.rotate();
  distance = Math.max(0.05, Math.min(0.95,
    distance + (Math.random() - 0.5) * 0.02));
  updateHUD();
}, 2000);

/* ═══════════════════════════════════════════════════════════
   ЧАСТЬ 9 · СТАРТ
   ═══════════════════════════════════════════════════════════ */
addMsg("sys", "точка зафиксирована. now = A.");
addMsg("sys", "координаты: Ψ 0.36/0.31/0.33 · плоскость 0 · d 0.40");
addMsg("resp ya", "начни.", "Я");
